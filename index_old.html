<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thailand Family Adventure V4</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system,
          Segoe UI,
          sans-serif;
        background: #08111f;
        color: #fff;
      }
      .app {
        display: grid;
        grid-template-columns: 320px 1fr 420px;
        height: 100vh;
      }
      .left,
      .right {
        background: #0f172a;
        padding: 16px;
        overflow: auto;
      }
      #map {
        height: 100vh;
      }
      .stop {
        padding: 10px;
        margin: 6px 0;
        background: #1e293b;
        border-radius: 10px;
        cursor: pointer;
      }
      .stop.active {
        background: #0284c7;
      }
      .gallery {
        width: 100%;
        border-radius: 12px;
        margin-top: 8px;
      }
      .badge {
        display: inline-block;
        background: #0369a1;
        padding: 4px 8px;
        border-radius: 12px;
        margin: 3px;
      }
      .tabs button {
        padding: 8px 12px;
        margin-right: 6px;
      }
      .number-marker {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #0284c7;
        color: #fff;
        border: 2px solid #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      .budget-section {
        margin-bottom: 18px;
      }
      .budget-section h3 {
        margin-bottom: 4px;
        border-bottom: 1px solid #334155;
      }
      #landingPage {
    height: 100vh;

    background-image:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.55)
        ),
        url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=2000");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.hero {
    max-width: 900px;
    padding: 40px;
}

.hero h1 {
    font-size: 4rem;
    margin-bottom: 20px;
}

.hero h2 {
    margin-bottom: 25px;
}

.hero p {
    font-size: 1.3rem;
    margin-bottom: 30px;
}

.hero button {
    padding: 16px 32px;
    border: none;
    border-radius: 999px;
    background: #0284c7;
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
}
      @media (max-width: 800px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto 45svh auto;
    height: auto;
    min-height: 100svh;
  }

  .left,
  .right {
    min-width: 0;
    overflow: visible;
    padding: 16px;
  }

  #map {
    width: 100%;
    height: 45svh;
    min-height: 280px;
  }

  .hero {
    padding: 24px 18px;
  }

  .hero h1 {
    font-size: clamp(2rem, 9vw, 3rem);
  }

  .hero p {
    font-size: 1.1rem;
  }

  .tabs button {
    margin: 4px 6px 4px 0;
  }
}

    </style>
  </head>
<body>

  <div id="landingPage">

    <div class="hero">

      <h1>🏝 Thailand Family Adventure 2027</h1>

      <h2>
        Fra mørketid i Tromsø til paradis i Andamanhavet
      </h2>

      <p>
        Railay Beach • Koh Lanta • Koh Kradan • Koh Rok <p>

        Avreise Tromsø Tirsdag 9. Februar<p>
        
        Hjemreise Søndag 28. Februar<p>
        
        18 Netter i Thailand<p>
      </p>

      <button onclick="startJourney()">
        ▶ Start reisen
      </button>

    </div>

  </div>

  <div class="app" id="travelApp" style="display:none;">
      <div class="left">

        <div id="timeline"></div>
        <button onclick="playJourney()">▶ Spill av reisen</button>
      </div>
      <div id="map"></div>
      <div class="right">
        <div class="tabs">
          <button onclick="showInfo()">Reiseinfo</button
          ><button onclick="showBudget()">Økonomi 💰</button>
        </div>
        <div id="infoPanel">

          <div id="dates"></div>
          <p id="story"></p>
          <div id="highlights"></div>
          <h3>Sted</h3>
          <p id="place"></p>
          <img id="img1" class="gallery" /><img id="img2" class="gallery" /><img id="img3" class="gallery" />
        </div>
        <div id="budgetPanel" style="display: none"></div>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

           {

          from: "2027-02-26",

          place: "Koh Rok",
          coord: [7.215070, 99.066650],
          zoom: 13,
          story: "1 time i båt fra Koh Kradan. Koh Rok is the best place to go snorkeling from Koh Lanta. There are multiple agencies providing snorkeling tours to the island. The corals are beautiful and the myriad of fishes are enough for any person to be left craving a round two. Besides that, one can take shade under a palm tree and set up a hammock.",

          img2: "https://kohlanta.tours/_next/image?url=https%3A%2F%2Fqypzrwephzhtvhufhvyz.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Flisting-images%2Fkohtour-lanta%2Fkoh-rok-koh-haa-tour-from-koh-lanta%2Fgallery%2Fkoh-haa-snorkeling-tour-from-lanta.jpg&w=1920&q=75",

          { title: "6 netter Koh Lanta", amount: 10000 },
          { title: "6 netter Koh Kradan ", amount: 10000 },

        transport: [
          { title: "Båt:Ao Nam Mao→Railay", amount: 500 },
          { title: "Båt: Railay→Koh Lanta", amount: 1500 },
          { title: "Båt: Koh Lanta→Koh Kradan", amount: 1500 },
          { title: "Båt: Koh Kradan→Ao Nam Mao", amount: 2500 },
          { title: "Taxi: t/rAo Nam Mao→Airport", amount: 1000 },
        ],

          { title: "Mangrove Kayaking", amount: 2500 },
          { title: "Snorkling Koh Rok", amount: 3500 },
          { title: "Annet", amount: 5000 },
        ],
      };
      const map = L.map("map").setView([20, 50], 3);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
      }).addTo(map);
      L.polyline(
        itinerary.map((i) => i.coord),
        { color: "#38bdf8", weight: 4 },
      ).addTo(map);
      itinerary.forEach((s, i) => {
        let d = document.createElement("div");
        d.className = "stop";
        d.innerHTML = "<b>" + (i + 1) + ". " + s.title + "</b><br>" + s.from;
        d.onclick = () => show(i);
        timeline.appendChild(d);
      });
      itinerary.map((i, idx) =>
        L.marker(i.coord, {
          icon: L.divIcon({
            html: '<div class="number-marker">' + (idx + 1) + "</div>",
            iconSize: [30, 30],
          }),
        }).addTo(map),
      );
      function show(i) {
        document
          .querySelectorAll(".stop")
          .forEach((e, n) => e.classList.toggle("active", n === i));
        let s = itinerary[i];
        title.textContent = s.title;
        dates.textContent = s.from + " → " + s.to;
        story.innerHTML = s.story;
        place.textContent = s.place;
        img1.src = s.img1;
        img2.src = s.img2;
        img3.src = s.img3;
        highlights.innerHTML = s.badges
          .map((b) => '<span class="badge">' + b + "</span>")
          .join("");
        map.flyTo(s.coord, s.zoom, { duration: 2 });
      }
      function playJourney() {
        let i = 0;
        show(0);
        let t = setInterval(() => {
          i++;
          if (i >= itinerary.length) {
            clearInterval(t);
            return;
          }
          show(i);
        }, 3500);
      }
      function showInfo() {
        infoPanel.style.display = "block";
        budgetPanel.style.display = "none";
      }
      function showBudget() {
        infoPanel.style.display = "none";
        budgetPanel.style.display = "block";
        renderBudget();
      }
      function renderBudget() {
        let total = 0,
          html = "";
        for (const [k, v] of Object.entries(budget)) {
          html += '<div class="budget-section"><h3>' + k + "</h3>";
          v.forEach((x) => {
            total += x.amount;
            html +=
              "<p>" +
              x.title +
              ": " +
              x.amount.toLocaleString("no-NO") +
              " kr</p>";
          });
          html += "</div>";
        }
        html +=
          "<hr><h2>Total familiekostnad: " +
          total.toLocaleString("no-NO") +
          " kr</h2>";
        budgetPanel.innerHTML = html;
      }
function startJourney(){

    document.getElementById(
        'landingPage'
    ).style.display='none';

    document.getElementById(
        'travelApp'
    ).style.display='grid';

    setTimeout(() => {
        map.invalidateSize();
    }, 200);

}
      show(0);
    </script>
  </body>
</html>
