<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Thailand Family Adventure V8</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #0284c7;
        --text: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          Segoe UI,
          sans-serif;
        background: var(--bg);
        color: #fff;
      }
      .page {
        display: none;
        height: 100vh;
      }
      .page.active {
        display: block;
      }
      #homePage.active {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .hero button {
        display: block;
        width: 320px;
        margin: 10px auto;
        padding: 16px;
        font-size: 1.2rem;
      }
      .topbar {
        padding: 10px;
        background: #111827;
      }
      .layout {
        display: grid;
        grid-template-columns: 260px 1fr 420px;
        height: calc(100vh - 52px);
      }
      .left {
        background: #111827;
        padding: 12px;
        overflow: auto;
      }
      .right {
        padding: 16px;
        overflow: auto;
      }
      .menubtn {
        width: 100%;
        padding: 12px;
        margin-bottom: 8px;
        background: #1e293b;
        color: white;
        border: none;
        border-radius: 8px;
        text-align: left;
      }
      .gallery img {
        width: 100%;
        border-radius: 10px;
        margin-top: 10px;
      }
      .map {
        height: 100%;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 45vh auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="homePage" class="page active">
      <div class="hero">
        <h1>🏝 Thailand Family Adventure 2027</h1>
        <p>Velg visning</p>
        <button onclick="showPage('locationsPage')">📍 Lokasjoner</button
        ><button onclick="showPage('logisticsPage')">✈️ Logistikk</button
        ><button onclick="showPage('economyPage')">💰 Økonomi</button>
      </div>
    </div>
    <div id="locationsPage" class="page">
      <div class="topbar">
        <button onclick="showPage('homePage')">← Til forsiden</button>
      </div>
      <div class="layout">
        <div class="left" id="locMenu"></div>
        <div id="locationsMap" class="map"></div>
        <div class="right">
          <h2 id="locTitle"></h2>
          <p id="locHotel"></p>
          <div id="locDesc"></div>
          <div id="locGallery" class="gallery"></div>
        </div>
      </div>
    </div>
    <div id="logisticsPage" class="page">
      <div class="topbar">
        <button onclick="showPage('homePage')">← Til forsiden</button>
      </div>
      <div class="layout">
        <div class="left" id="logMenu"></div>
        <div id="logisticsMap" class="map"></div>
        <div class="right">
          <h2 id="logTitle"></h2>
          <div id="logDesc"></div>
        </div>
      </div>
    </div>
    <div id="economyPage" class="page">
      <div class="topbar">
        <button onclick="showPage('homePage')">← Til forsiden</button>
      </div>
      <div style="padding: 20px">
        <h1>Økonomi</h1>
        <p>Fly: 72 000 kr</p>
        <p>Hotell: 45 000 kr</p>
        <p>Transport: 4 000 kr</p>
        <h2>Total: 127 000 kr</h2>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      const locations = [
        {
          title: "Railay Beach",
          hotel: "Rayavadee",
          coord: [8.0059, 98.838],
          zoom: 13,
          description: "Kalksteinsklipper, strender og båtturer.",
          images: [
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200",
            "https://images.unsplash.com/photo-1468413253725-0d5181091126?w=1200",
          ],
        },
        {
          title: "Koh Lanta",
          hotel: "Chom Dao Resort",
          coord: [7.6246, 99.0798],
          zoom: 12,
          description: "Mangroveskog og kajakk.",
          images: [
            "https://images.unsplash.com/photo-1527631746610-bca00a040d60?w=1200",
          ],
        },
        {
          title: "Koh Kradan",
          hotel: "Beach Resort",
          coord: [7.313, 99.271],
          zoom: 13,
          description: "Kritthvite strender og snorkling.",
          images: [
            "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?w=1200",
          ],
        },
        {
          title: "Koh Rok",
          hotel: "Dagstur",
          coord: [7.198, 99.057],
          zoom: 13,
          description: "Korallrev og snorkling.",
          images: [
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200",
          ],
        },
      ];
      const logistics = [
        {
          title: "1. Bil til Tromsø Lufthavn",
          coord: [69.6833, 18.9189],
          description: "Kjøring til flyplassen.",
        },
        {
          title: "2. Fly til København",
          coord: [55.6181, 12.656],
          description: "Første flyetappe.",
        },
        {
          title: "3. Fly til Krabi",
          coord: [8.0991, 98.9862],
          description: "Langfly til Thailand.",
        },
        {
          title: "4. Båt til Railay",
          coord: [8.0059, 98.838],
          description: "Longtailbåt.",
        },
        {
          title: "5. Båt til Koh Lanta",
          coord: [7.6246, 99.0798],
          description: "Båt sørover.",
        },
        {
          title: "6. Båt til Koh Kradan",
          coord: [7.313, 99.271],
          description: "Til paradisstrender.",
        },
        {
          title: "7. Båt til Koh Rok",
          coord: [7.198, 99.057],
          description: "Snorkletur.",
        },
      ];
      function showPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        setTimeout(() => {
          locationsMap.invalidateSize();
          logisticsMap.invalidateSize();
        }, 300);
      }
      const locationsMap = L.map("locationsMap");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        locationsMap,
      );
      locations.forEach((l, i) => {
        L.circleMarker(l.coord, { radius: 10, color: "#0284c7" }).addTo(
          locationsMap,
        );
        let b = document.createElement("button");
        b.className = "menubtn";
        b.textContent = l.title;
        b.onclick = () => showLocation(i);
        locMenu.appendChild(b);
      });
      locationsMap.fitBounds(locations.map((x) => x.coord));
      function showLocation(i) {
        const l = locations[i];
        locTitle.textContent = l.title;
        locHotel.innerHTML = "<strong>Hotell:</strong> " + l.hotel;
        locDesc.innerHTML = l.description;
        locGallery.innerHTML = l.images
          .map((img) => '<img src="' + img + '">')
          .join("");
        locationsMap.flyTo(l.coord, l.zoom);
      }
      showLocation(0);
      const logisticsMap = L.map("logisticsMap");
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        logisticsMap,
      );
      L.polyline(
        logistics.map((x) => x.coord),
        { color: "#38bdf8", weight: 4 },
      ).addTo(logisticsMap);
      logistics.forEach((l, i) => {
        L.marker(l.coord, {
          icon: L.divIcon({
            html:
              '<div style="background:#0284c7;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold">' +
              (i + 1) +
              "</div>",
            iconSize: [28, 28],
          }),
        }).addTo(logisticsMap);
        let b = document.createElement("button");
        b.className = "menubtn";
        b.textContent = l.title;
        b.onclick = () => {
          logTitle.textContent = l.title;
          logDesc.innerHTML = l.description;
          logisticsMap.flyTo(l.coord, i < 2 ? 5 : 10);
        };
        logMenu.appendChild(b);
      });
      logisticsMap.fitBounds(logistics.map((x) => x.coord));
    </script>
  </body>
</html>
